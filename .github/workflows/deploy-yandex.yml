name: Загрузить бота в Yandex Cloud

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установить yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Загрузить функцию, хранилище, таймер и webhook
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          exec 2> >(tee "$RUNNER_TEMP/err.log" >&2)
          trap 'echo "::error::Строка $LINENO: $BASH_COMMAND"; grep -v -e trace -e client-trace "$RUNNER_TEMP/err.log" | head -5 | while read -r l; do echo "::error::$l"; done' ERR
          [ -n "$YC_SA_KEY" ] || { echo "::error::Нет секрета YC_SA_KEY"; exit 1; }
          [ -n "$BOT_TOKEN" ] || { echo "::error::Нет секрета BOT_TOKEN"; exit 1; }
          # починить ключ, если телефон заменил кавычки или переносы строк
          python3 - <<'PY'
          import json, os
          raw = os.environ["YC_SA_KEY"].strip().lstrip("\ufeff")
          for a, b in (("\u201c", '"'), ("\u201d", '"'), ("\u00ab", '"'), ("\u00bb", '"'), ("\u2018", "'"), ("\u2019", "'"), ("\u00a0", " ")):
              raw = raw.replace(a, b)
          if not raw.startswith("{"):
              raw = "{" + raw.rstrip(", \n")
          if not raw.endswith("}"):
              raw = raw.rstrip(", \n") + "}"
          try:
              k = json.loads(raw, strict=False)
          except Exception as e:
              print(f"::error::Ключ YC_SA_KEY — не JSON ({type(e).__name__} на позиции {getattr(e, 'pos', '?')} из {len(raw)} символов). Начало: {raw[:12]!r}, конец: {raw[-8:]!r}")
              raise SystemExit(1)
          pk = k.get("private_key", "")
          print(f"::notice::ключ: поля {sorted(k)}, private_key {len(pk)} симв., BEGIN={'BEGIN PRIVATE KEY' in pk}, END={'END PRIVATE KEY' in pk}")
          json.dump(k, open(os.environ["RUNNER_TEMP"] + "/key.json", "w"))
          PY
          yc config profile create bot >/dev/null
          yc config set endpoint api.cloud.yandex.net:443
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          SA_ID=$(jq -r .service_account_id "$RUNNER_TEMP/key.json")
          FOLDER_ID=$(yc iam service-account get --id "$SA_ID" --format json | jq -r .folder_id)
          yc config set folder-id "$FOLDER_ID"
          SECRET=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          echo "::add-mask::$SECRET"

          echo "::notice::этап: ключ принят, каталог найден"
          BUCKET="gubkin-bot-$FOLDER_ID"
          yc storage bucket get "$BUCKET" >/dev/null 2>&1 || yc storage bucket create --name "$BUCKET" >/dev/null

          yc serverless function get --name gubkin-bot >/dev/null 2>&1 || yc serverless function create --name gubkin-bot >/dev/null
          FUNC_ID=$(yc serverless function get --name gubkin-bot --format json | jq -r .id)
          yc serverless function allow-unauthenticated-invoke --name gubkin-bot >/dev/null

          echo "::notice::этап: хранилище и функция созданы"
          zip -qj bot.zip index.py gubkin_bot.py gubkin_schedule.py
          timeout 300 yc serverless function version create --function-name gubkin-bot \
            --runtime python312 --entrypoint index.handler --memory 128m --execution-timeout 60s \
            --source-path bot.zip --service-account-id "$SA_ID" \
            --environment "BOT_TOKEN=$BOT_TOKEN,STATE_BUCKET=$BUCKET,WEBHOOK_SECRET=$SECRET" >/dev/null

          echo "::notice::этап: код функции загружен"
          yc serverless trigger get --name gubkin-bot-timer >/dev/null 2>&1 || \
            yc serverless trigger create timer --name gubkin-bot-timer --cron-expression '0/5 * ? * * *' \
              --invoke-function-id "$FUNC_ID" --invoke-function-service-account-id "$SA_ID" >/dev/null

          echo "::notice::этап: таймер создан"
          curl -sS -m 30 "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            -d "url=https://functions.yandexcloud.net/$FUNC_ID" -d "secret_token=$SECRET" \
            -d 'allowed_updates=["message"]' >/dev/null
          echo "::notice::webhook $(curl -sS -m 30 "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo" | jq -c '.result | {pending_update_count, last_error_message}')"

          # проверка: один «тик» таймера и последние строки логов функции
          timeout 90 yc serverless function invoke --name gubkin-bot \
            -d '{"messages":[{"event_metadata":{"event_type":"yandex.cloud.events.serverless.triggers.TimerMessage"}}]}' >/dev/null || true
          sleep 5
          timeout 60 yc serverless function logs gubkin-bot --since 3m 2>/dev/null | grep -vE "^(START|END|REPORT)" | tail -5 | while read -r l; do echo "::notice::log $l"; done || true
          timeout 120 yc serverless function invoke --name gubkin-bot -d '{"diag": true}' 2>/dev/null \
            | jq -r '.body | fromjson | .[]' | while read -r l; do echo "::notice::diag $l"; done || true
          echo "::notice::готово, функция $FUNC_ID"
