name: Расписание бот

on:
  schedule:
    - cron: "*/15 * * * *"   # запуск каждые 15 минут
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Восстановить состояние бота
        uses: actions/cache/restore@v4
        with:
          path: bot_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Запустить бота на 14 минут
        run: python gubkin_bot.py --run-for 840
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Сохранить состояние бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
