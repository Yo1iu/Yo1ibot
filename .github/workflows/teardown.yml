name: Отключить бота и удалить из Yandex Cloud

on: workflow_dispatch

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Установить yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Удалить всё
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -uo pipefail
          note() { echo "::warning::$*"; }
          if [ -n "$BOT_TOKEN" ]; then
            r=$(curl -sS -m 30 "https://api.telegram.org/bot$BOT_TOKEN/deleteWebhook" -d drop_pending_updates=true | jq -c .ok)
            note "telegram deleteWebhook ok=$r"
          fi
          python3 - <<'PY'
          import json, os
          raw = os.environ["YC_SA_KEY"].strip().lstrip("﻿")
          for a, b in (("“", '"'), ("”", '"'), ("«", '"'), ("»", '"'), (" ", " ")):
              raw = raw.replace(a, b)
          if not raw.startswith("{"):
              raw = "{" + raw.rstrip(", \n")
          if not raw.endswith("}"):
              raw = raw.rstrip(", \n") + "}"
          json.dump(json.loads(raw, strict=False), open(os.environ["RUNNER_TEMP"] + "/key.json", "w"))
          PY
          yc config profile create bot >/dev/null
          yc config set endpoint api.cloud.yandex.net:443
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          SA_ID=$(jq -r .service_account_id "$RUNNER_TEMP/key.json")
          FOLDER_ID=$(yc iam service-account get --id "$SA_ID" --format json | jq -r .folder_id)
          yc config set folder-id "$FOLDER_ID"
          BUCKET="gubkin-bot-$FOLDER_ID"

          timeout 120 yc serverless trigger delete --name gubkin-bot-timer >/dev/null 2>&1; note "trigger delete rc=$?"
          timeout 120 yc serverless function delete --name gubkin-bot >/dev/null 2>&1; note "function delete rc=$?"
          timeout 60 yc storage s3api delete-object --bucket "$BUCKET" --key state.json >/dev/null 2>&1; note "state delete rc=$?"
          timeout 60 yc storage bucket delete --name "$BUCKET" >/dev/null 2>&1; note "bucket delete rc=$?"

          note "left: triggers=$(yc serverless trigger list --format json | jq length) functions=$(yc serverless function list --format json | jq length) buckets=$(yc storage bucket list --format json | jq length)"
